name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project
        run: |
          # 1. Generate clean Android scaffold
          flutter create --org com.gotcha.game --project-name gotcha_game .

          # 2. Set minSdk = 24 in build.gradle.kts
          GRADLE_FILE=$(find android/app -name "build.gradle*" | head -n 1)
          sed -i 's/minSdk = .*/minSdk = 24/' "$GRADLE_FILE" || true
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' "$GRADLE_FILE" || true

          # 3. Set clean app label in AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="gotcha_game"/android:label="Gotcha"/' "$MANIFEST_FILE" || true
          sed -i 's/android:label=".*"/android:label="Gotcha"/' "$MANIFEST_FILE" || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gotcha-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Gotcha Game v1.0.2 APK (Pure Native Flutter - 12+ Barmoq)"
          body: "Gotcha o'yini - 100% Native Flutter drayveri (12 tagacha to'liq multi-touch qo'llab-quvvatlaydi), yangi dizayn va toza audio bilan."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
