name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project
        run: |
          # 1. Generate clean Android scaffold
          flutter create --org com.gotcha.game --project-name gotcha_game .

          # 2. Set minSdk = 23 (Flutter latest requirement)
          GRADLE_FILE=$(find android/app -name "build.gradle*" | head -n 1)
          sed -i 's/minSdk = .*/minSdk = 23/' "$GRADLE_FILE" || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' "$GRADLE_FILE" || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
          cd ..

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gotcha-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Gotcha Game v1.0.1 APK (Yangi Dizayn va Ovozlar)"
          body: "Gotcha o'yini - Yangi dizayn, 12 kishilik multi-touch, haqiqiy pufakcha ovozi va kengayish effekti bilan."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
